services:
  - type: web
    name: aws-mock-exam-backend
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm --prefix backend ci
    startCommand: npm --prefix backend start
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_VERSION
        value: 22.19.0
      - key: NODE_ENV
        value: production
      - key: AI_SCHEDULER_ENABLED
        value: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
# Configure a persistent DATA_DIR for durable administrator edits.
